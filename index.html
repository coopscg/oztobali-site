<!DOCTYPE html>
<html lang="en-AU">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OztoBali | The Australian's Guide to Moving to &amp; Living in Bali</title>
  <meta name="description" content="Everything Australians need to move to, live in, and holiday in Bali: visas & residency costs, Bali property rules, tax obligations in Australia and Indonesia, culture, and the best places to stay." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --font-body: 'Inter', sans-serif;
      --font-display: 'Fraunces', serif;
      --oz-ink: #062420;
      --oz-teal: #0B4F4A;
      --oz-gold: #E3A857;
      --oz-terracotta: #D9714E;
      --oz-cream: #F6EFE4;
    }

    * {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--oz-ink);
      color: var(--oz-cream);
      margin: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: var(--font-display);
    }

    ::selection {
      background-color: var(--oz-gold);
      color: #062420;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #041815;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #0B4F4A 0%, #14746C 100%);
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #E3A857 0%, #D9714E 100%);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "framer-motion": "https://esm.sh/framer-motion@^12.29.0",
      "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
      "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
      "react/": "https://esm.sh/react@^19.2.3/",
      "react": "https://esm.sh/react@^19.2.3"
    }
  }
  </script>
  <link rel="canonical" href="https://oztobali.com/" />
  <meta property="og:locale" content="en_AU" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://oztobali.com/#website",
    "name": "OztoBali",
    "description": "The Australian's guide to moving to, living in, and holidaying in Bali — visas, property, tax, culture and travel.",
    "url": "https://oztobali.com/",
    "publisher": { "@id": "https://oztobali.com/#organization" }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://oztobali.com/#organization",
    "name": "OztoBali",
    "url": "https://oztobali.com/",
    "description": "Independent information resource for Australians moving to, living in, or holidaying in Bali, Indonesia.",
    "areaServed": [{ "@type": "Country", "name": "Australia" }, { "@type": "Country", "name": "Indonesia" }],
    "sameAs": []
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
